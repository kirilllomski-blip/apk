name: Build Pixel Dynamic Island APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          if ! gradle assembleDebug --stacktrace 2>&1 | tee gradle_output.log; then
            echo "::error::Gradle assembleDebug failed!"
            echo "=== SEARCHING ERRORS ==="
            grep -E "(e: |error: |FAILURE: )" gradle_output.log -A 2 || true
            echo "=== TAIL 40 ==="
            tail -n 40 gradle_output.log
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelDynamicIsland-APK
          path: app/build/outputs/apk/debug/*.apk
