name: Build Pixel Dynamic Island APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          if ! gradle assembleDebug --stacktrace > build.log 2>&1; then
            ERR_MSG=$(grep -E "(e: |error:)" build.log | head -n 10 | tr '\n' ' | ')
            if [ -z "$ERR_MSG" ]; then
              ERR_MSG=$(tail -n 20 build.log | tr '\n' ' | ')
            fi
            echo "::error::$ERR_MSG"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelDynamicIsland-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: latest
          name: "Pixel Dynamic Island APK (Cozy Brick Update)"
          body: "Обновление Pixel Dynamic Island: Cozy Brick UI, питомцы Кот и Пес, переключение музыки и авто-детектор Анти-Рилсов."
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

